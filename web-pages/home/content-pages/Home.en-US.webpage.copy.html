{% assign userRoles = user.roles | join: ',' %}
<script>
  window.portalUserRoles = "{{ userRoles }}".toLowerCase();
</script>

<!-- HERO SECTION -->
<section class="hero-section py-5" style="font-family: Gotham, Arial, sans-serif;">
  <div class="container px-4">
    <div class="row align-items-center g-5">
      <!-- Left -->
      <div class="col-lg-6">
        <div class="mb-4">
          <h1 class="hero-title" style="font-size: 3.2rem; font-weight: 700; color: var(--bs-primary);">Get Help <br />When You Need It</h1>
          <p class="lead text-secondary mb-0">Submit requests through our centralized portal.</p>
        </div>
        <div class="d-flex flex-column flex-sm-row gap-3 mb-4"><a href="#cardsRow" class="btn btn-primary px-4">Submit Request</a><a href="/Track-Ticket" class="btn px-4">Track Ticket</a></div>
      </div>
      <!-- Right -->
      <div class="col-lg-6 d-flex justify-content-center align-items-center p-0">
        <div class="hero-image-frame">
          <img src="/heroimage.png" alt="Hero Image" class="hero-img-3d" />
        </div>
      </div>
    </div>
  </div>
</section>

<!-- REQUEST CARDS SECTION -->
<div class="container py-4">
  <h2 class="mb-4 fw-bold" style="color: var(--bs-primary);">Raise a Request</h2>
  <div class="mb-4 d-none">
    <label for="typeDropdown" class="form-label"><strong>Select Request Type:</strong></label
    ><select id="typeDropdown" aria-label="Select Request Type" class="form-select"></select>
  </div>
  <div id="cardsRow" class="row row-cols-1 row-cols-md-3 g-4"></div>
</div>

<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div></div>
</div>

<!-- Script for Request Cards -->
<script>
        const typeConfig = [
          {
            key: "request",
            label: "Request",
            cards: [
              { id: "hr-request", title: "HR", desc: "Request HR-related needs all in one place.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false },
              { id: "procurement-request", title: "Procurement", desc: "Raise procurement-related requests.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false },
              { id: "it-request", title: "IT", desc: "Raise IT-related requests and support.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false },
              //{ id: "it-request", title: "IT", desc: "Raise IT-related requests and support.", btnText: "Submit Request", btnClass: "btn-secondary disabled", comingSoon: true },
              { id: "consignee-support", title: "Consignee Support", desc: "Raise support for consignee-related requests", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false, requiredRole: "starlinks customer service team" },
              { id: "legal-request", title: "Legal", desc: "Raise legal related requests.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false },
              // { id: "legal-request", title: "Legal", desc: "Raise legal related requests.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false, requiredRole: "beta user" },
              // { id: "customer-onboarding", title: "Customer Onboarding", desc: "Request onboarding for new customers.", btnText: "Submit Request", btnClass: "btn-secondary disabled", comingSoon: true },
              { id: "finance-request", title: "Finance", desc: "Submit finance-related requests and queries.", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: true },
              { id: "facilities-request", title: "Facilities & WPS", desc: "Raise facilities & workplace related requests and support.", btnText: "Submit Request", btnClass: "btn-secondary disabled", comingSoon: true },
              // { id: "asset-management", title: "Asset Management", desc: "Raise asset-related requests.", btnText: "Submit Request", btnClass: "btn-secondary disabled", comingSoon: true },
              { id: "compliance-risk-management", title: "Compliance & Risk", desc: "Raise compliance & risk related requests.", btnText: "Submit Request", btnClass: "btn-secondary disabled", comingSoon: true },
              { id: "employee-transport-request", title: "Employee Transport", desc: "Transportation service for Starlinks Employees", btnText: "Submit Request", btnClass: "btn-primary", comingSoon: false }
            ]
          }
        ];

    function populateDropdown() {
      const dropdown = document.getElementById('typeDropdown');
      dropdown.innerHTML = typeConfig.map(
        t => `<option value="${t.key}">${t.label}</option>`
      ).join("");
    }

    function renderCards(typeKey) {
      const cardsRow = document.getElementById('cardsRow');
      const group = typeConfig.find(cfg => cfg.key === typeKey);
      if (!group) return (cardsRow.innerHTML = "");

      const roles = window.portalUserRoles || "";

      // FILTER CARDS BASED ON ROLE
      const visibleCards = group.cards.filter(card => {
        if (!card.requiredRole) return true; // No restriction
        return roles.includes(card.requiredRole.toLowerCase());
      });

      cardsRow.innerHTML = visibleCards.map(card => {
        const isComingSoon = !!card.comingSoon;
        const btnText = isComingSoon ? "Coming Soon" : card.btnText;
        const disabledAttr = isComingSoon ? "disabled" : "";

        return `
          <div class="col card-group">
            <div class="card h-100">
              <div class="card-body d-flex flex-column">
                <h4 class="card-title">${card.title}</h4>
                <p class="lead mb-2 text-muted">${card.desc}</p>
                <button type="button"
                  class="btn mt-auto ${card.btnClass} card-action-btn"
                  data-card-id="${card.id}"
                  ${disabledAttr}>
                  ${btnText}
                </button>
              </div>
            </div>
          </div>`;
      }).join("");

      // Attach click handler
      document.querySelectorAll('.card-action-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          if (this.disabled) return;
          const cardId = this.getAttribute('data-card-id');
          window.location.href = `/Submit-Ticket?formname=${encodeURIComponent(cardId)}`;
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      populateDropdown();
      renderCards(typeConfig[0].key);

      document.getElementById('typeDropdown').addEventListener('change', e => {
        renderCards(e.target.value);
      });
    });
</script>

<!-- Scripts -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init();
</script>
