{% if ticket.sh_approvalid %}
<div class="container border p-4 mt-3">
  <fieldset class="p-4 mb-3 col-12">
    <legend class="d-flex justify-content-between align-items-center">
      <span>Approvals Section</span>
    </legend>
    <div id="approval-section" data-current-user="{{ user.emailaddress1 }}">
      <div id="approval-body"></div>
    </div>
  </fieldset>
</div>
{% endif %}

<style>
  .apv-card {
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }

  .apv-header {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .apv-title {
    font-size: 14px;
    font-weight: 600;
    color: #111827;
    margin: 0 0 8px 0;
  }

  .apv-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .apv-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .apv-badge-pending  { background: #fef3c7; color: #92400e; }
  .apv-badge-approved { background: #d1fae5; color: #065f46; }
  .apv-badge-rejected { background: #fee2e2; color: #991b1b; }
  .apv-badge-type     { background: #f3f4f6; color: #374151; }

  .apv-created {
    font-size: 12px;
    color: #9ca3af;
  }

  .apv-refresh {
    flex-shrink: 0;
    background: #ffffff;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .apv-refresh:hover {
    background: #f9fafb;
    border-color: #9ca3af;
  }

  .apv-list {
    padding: 4px 0;
  }

  .apv-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 20px;
  }

  /* .apv-row:last-child {
    border-bottom: none;
  } */

  .apv-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .apv-avatar-pending  { background: #f3f4f6; color: #6b7280; border: 2px solid #e5e7eb; }
  .apv-avatar-approved { background: #d1fae5; color: #065f46; border: 2px solid #a7f3d0; }
  .apv-avatar-rejected { background: #fee2e2; color: #991b1b; border: 2px solid #fecaca; }

  .apv-row-body {
    flex: 1;
    min-width: 0;
  }

  .apv-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 3px;
  }

  .apv-name {
    font-size: 14px;
    font-weight: 600;
    color: #111827;
  }

  .apv-you {
    display: inline-block;
    background: #fff8ee;
    color: #92400e;
    border: 1px solid #FAA633;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
    letter-spacing: 0.02em;
  }

  /* Sequential connector line between avatars */
  .apv-list.is-sequential .apv-row {
    position: relative;
  }

  .apv-list.is-sequential .apv-row:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 37px;
    top: 64px;
    bottom: 0;
    width: 2px;
    background: #e5e7eb;
    z-index: 0;
  }

  .apv-list.is-sequential .apv-avatar {
    position: relative;
    z-index: 1;
  }

  .apv-decision {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .apv-decision-approved { background: #d1fae5; color: #065f46; }
  .apv-decision-rejected { background: #fee2e2; color: #991b1b; }

  .apv-date {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  .apv-msg {
    font-size: 13px;
    margin: 0;
    line-height: 1.5;
  }

  .apv-msg-awaiting  { color: #9ca3af; font-style: italic; }
  .apv-msg-notice    { color: #006F4A; font-weight: 500; font-style: italic; }
  .apv-msg-waiting   { color: #d97706; font-style: italic; }
  .apv-msg-done-ok   { color: #059669; }
  .apv-msg-done-rej  { color: #dc2626; }
  .apv-msg-comment   { color: #374151; }
  .apv-msg-nocomment { color: #d1d5db; font-style: italic; }

  .apv-error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px 18px;
    border-radius: 8px;
    border: 1px solid #fecaca;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .apv-skeleton {
    background: linear-gradient(90deg, #f3f4f6 25%, #e9eaec 50%, #f3f4f6 75%);
    background-size: 200% 100%;
    animation: apv-shimmer 1.5s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes apv-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>

<script>
(async function () {
  const section     = document.getElementById("approval-section");
  const approvalId  = "{{ ticket.sh_approvalid }}";
  const currentUser = section?.dataset.currentUser?.toLowerCase().trim();

  if (!approvalId || approvalId.trim() === "") {
    if (section) section.style.display = "none";
    return;
  }

  async function loadApprovalData(showSkeleton = true) {
    if (showSkeleton) {
      document.getElementById("approval-body").innerHTML = skeletonHTML();
    }

    try {
      const now = new Date().toISOString();

      const [approvalRes, requestsRes, responsesRes] = await Promise.all([
        fetch(`/_api/msdyn_flow_approvals?$filter=(msdyn_flow_approvalid eq '${approvalId}' and createdon le ${now})&$top=1`, { cache: "no-store" }),
        fetch(`/_api/msdyn_flow_approvalrequests?$filter=(_msdyn_flow_approvalrequest_approval_value eq '${approvalId}' and createdon le ${now})&$orderby=msdyn_flow_approvalrequest_stepnumber asc`, { cache: "no-store" }),
        fetch(`/_api/msdyn_flow_approvalresponses?$filter=(_msdyn_flow_approvalresponse_approval_value eq '${approvalId}' and createdon le ${now})`, { cache: "no-store" })
      ]);

      if (!approvalRes.ok)  throw new Error(`Approval: ${approvalRes.status}`);
      if (!requestsRes.ok)  throw new Error(`Requests: ${requestsRes.status}`);
      if (!responsesRes.ok) throw new Error(`Responses: ${responsesRes.status}`);

      const approval  = (await approvalRes.json()).value?.[0];
      const requests  = (await requestsRes.json()).value  || [];
      const responses = (await responsesRes.json()).value || [];

      if (!approval) {
        document.getElementById("approval-body").innerHTML =
          `<div class="apv-card"><div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px">No approval record found.</div></div>`;
        return;
      }

      let userEmailMap = {};
      const ownerIds = [...new Set(requests.map(r => r["_ownerid_value"]).filter(Boolean))];

      if (ownerIds.length > 0) {
        const userFilter = ownerIds.map(id => `systemuserid eq ${id}`).join(" or ");
        const usersRes = await fetch(
          `/_api/systemusers?$select=systemuserid,internalemailaddress&$filter=${userFilter}`,
          { cache: "no-store" }
        );
        if (usersRes.ok) {
          const usersData = await usersRes.json();
          usersData.value?.forEach(u => {
            userEmailMap[u.systemuserid.toLowerCase()] = u.internalemailaddress?.toLowerCase();
          });
        }
      }

      renderApproval(approval, requests, responses, userEmailMap);

    } catch (err) {
      console.error("Approval load error:", err);
      document.getElementById("approval-body").innerHTML =
        `<div class="apv-error">
          Failed to load approval details.
          <button onclick="window.loadApprovalData()" class="apv-refresh" style="margin-left:12px">Retry</button>
        </div>`;
    }
  }

  function renderApproval(approval, requests, responses, userEmailMap) {
    const result      = approval.msdyn_flow_approval_result;
    const isApproved  = result === "Approve";
    const isRejected  = result === "Reject";
    const isPending   = !result;

    const statusClass = isPending  ? "apv-badge-pending"
                      : isApproved ? "apv-badge-approved"
                      :              "apv-badge-rejected";
    const statusLabel = isPending  ? "Pending"
                      : isApproved ? "Approved"
                      :              "Rejected";

    const modelType    = approval.msdyn_flow_approval_modeltype;
    const isBasic      = modelType === "msdyn_flow_basicapprovalmodel";
    const isAwaitAll   = modelType === "msdyn_flow_awaitallapprovalmodel";
    const isSequential = modelType === "msdyn_flow_sequentialapprovalmodel";
    const typeLabel    = isBasic      ? "First to respond"
                       : isAwaitAll   ? "Everyone must approve"
                       : isSequential ? "Sequential"
                       :                "Unknown";

    const sortedRequests = [...requests].sort((a, b) => {
      if (isSequential) {
        // Descending: highest stage first (matches Teams order)
        return (b.msdyn_flow_approvalrequest_stage ?? 0) - (a.msdyn_flow_approvalrequest_stage ?? 0);
      }
      return new Date(a.createdon) - new Date(b.createdon);
    });
    // <span class="apv-badge ${statusClass}">${statusLabel}</span>
    let html = `
    <div class="apv-card">
      <div class="apv-header">
        <div style="flex:1;min-width:0">
          <h3 class="apv-title">${approval.msdyn_flow_approval_title ?? "Approval Request"}</h3>
          <div class="apv-meta">
            
            <span class="apv-badge apv-badge-type">${typeLabel}</span>
            <span class="apv-created">Created ${formatDate(approval.createdon)}</span>
            ${approval.msdyn_flow_approval_completedon
              ? `<span class="apv-created">&nbsp;·&nbsp; Completed ${formatDate(approval.msdyn_flow_approval_completedon)}</span>`
              : ""}
          </div>
        </div>
        <button onclick="window.loadApprovalData(false)" class="apv-refresh">Refresh</button>
      </div>
      <div class="apv-list ${isSequential ? 'is-sequential' : ''}">`;

    sortedRequests.forEach(req => {
      const name       = req["_ownerid_value@OData.Community.Display.V1.FormattedValue"] ?? "—";
      const initial    = name.charAt(0).toUpperCase();
      const ownerId    = req["_ownerid_value"]?.toLowerCase();
      const stage      = req.msdyn_flow_approvalrequest_stage;
      const assignedOn = req.createdon;

      const resp       = responses.find(r => r["_ownerid_value"] === req["_ownerid_value"]);
      const decision   = resp?.msdyn_flow_approvalresponse_response;
      const comment    = resp?.msdyn_flow_approvalresponse_comments?.trim();
      const actionOn   = resp?.createdon;

      const rowPending  = !resp;
      const rowApproved = decision === "Approve";

      const ownerEmail    = userEmailMap[ownerId] ?? "";
      const isCurrentUser = ownerEmail === currentUser;

      const avatarClass = rowPending  ? "apv-avatar-pending"
                        : rowApproved ? "apv-avatar-approved"
                        :               "apv-avatar-rejected";
      const avatarChar  = rowPending  ? initial
                        : rowApproved ? "✓"
                        :               "✕";

      // Determine status message for pending rows
      let msgHtml = "";
      if (rowPending) {
        if (result) {
          msgHtml = isRejected
            ? `<p class="apv-msg apv-msg-done-rej">Approval rejected — no action required</p>`
            : `<p class="apv-msg apv-msg-done-ok">Approval completed — no action required</p>`;
        } else if (isCurrentUser) {
          if (isSequential) {
            const firstPending = sortedRequests.find(r => {
              const hasResponded = responses.some(res => res["_ownerid_value"] === r["_ownerid_value"]);
              return r.statecode === 0 && !hasResponded;
            });
            const isMyTurn = firstPending?.["_ownerid_value"]?.toLowerCase() === ownerId;
            msgHtml = isMyTurn
              ? `<p class="apv-msg apv-msg-notice">Your approval is required — please respond via Teams or Outlook</p>`
              : `<p class="apv-msg apv-msg-waiting">Waiting for previous stage approver</p>`;
          } else {
            msgHtml = `<p class="apv-msg apv-msg-notice">Your approval is required — please respond via Teams or Outlook</p>`;
          }
        } else {
          msgHtml = `<p class="apv-msg apv-msg-awaiting">Awaiting response</p>`;
        }
      } else {
        msgHtml = comment
          ? `<p class="apv-msg apv-msg-comment">${comment}</p>`
          : `<p class="apv-msg apv-msg-nocomment">No comments added</p>`;
      }

      html += `
      <div class="apv-row">
        <div class="apv-avatar ${avatarClass}">${avatarChar}</div>
        <div class="apv-row-body">
          <div class="apv-row-top">
            <div>
              <span class="apv-name">${name}</span>
              ${isCurrentUser ? `<span class="apv-you">You</span>` : ""}
            </div>
            ${!rowPending
              ? `<span class="apv-decision ${rowApproved ? "apv-decision-approved" : "apv-decision-rejected"}">
                   ${rowApproved ? "Approved" : "Rejected"}
                 </span>`
              : ""}
          </div>
          <div class="apv-date">
            Assigned ${formatDate(assignedOn)}
            ${actionOn ? `&nbsp;·&nbsp; ${rowApproved ? "Approved" : "Rejected"} ${formatDate(actionOn)}` : ""}
          </div>
          ${msgHtml}
        </div>
      </div>`;
    });

    html += `</div></div>`;
    document.getElementById("approval-body").innerHTML = html;
  }

  function skeletonHTML() {
    const row = `
    <div class="apv-row">
      <div class="apv-skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="apv-skeleton" style="height:13px;width:55%;margin-bottom:8px"></div>
        <div class="apv-skeleton" style="height:11px;width:38%"></div>
      </div>
    </div>`;
    return `
    <div class="apv-card">
      <div class="apv-header">
        <div style="flex:1">
          <div class="apv-skeleton" style="height:14px;width:220px;margin-bottom:10px"></div>
          <div class="apv-skeleton" style="height:11px;width:140px"></div>
        </div>
      </div>
      <div class="apv-list">${row}${row}</div>
    </div>`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    return new Date(dateStr).toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  window.loadApprovalData = loadApprovalData;
  loadApprovalData();
})();
</script>

{% assign docuSignEnvelopeStatusEndPoint = settings["DocuSign/StatusFlowUrl"] %}

{% if ticket.sh_docusignenvelopeid %}

    <legend class="d-flex justify-content-between align-items-center">
      <span>Signatures Section</span>

<!--
  FLOW RESPONSE CONTRACT (as returned by the DocuSign status flow)
  -----------------------------------------------------------------
  POST { "envelopeId": "<ticket.sh_docusignenvelopeid>" }

  {
    "envelopeId": "e6bb209c-faca-802e-808d-5137c6751ce1",
    "overallStatus": "Sent",              // Sent | Completed | Declined | Voided (case varies)
    "totalCount": 9,
    "completedCount": 0,
    "declinedCount": 0,
    "allCompleted": false,
    "recipients": [
      {
        "role": "Finance",                // recipient's role label — doubles as display name
        "email": "sara.alamin@starlinks-me.com",
        "status": "created | sent | delivered | completed | declined | voided",
        "order": "1",                     // string; groups recipients into stages
        "sentDateTime": "2026-07-28T13:58:41.1900000Z",   // null until sent
        "completedDateTime": null          // set once signed/declined
      }
      // recipient count is dynamic — sometimes fewer, sometimes more
    ]
  }

  NOTES:
  - Kept intentionally simple: recipients are sorted by "order" and just
    displayed with role, email, status, and dates. No turn-taking or
    "your signature required" logic — that's left out on purpose.
  - If your flow's HTTP trigger URL contains a SAS signature (sig=...),
    remember that anyone viewing page source can see and call it directly.
-->

  }

    100% { background-position: -200% 0; }

<script>
(async function () {
  const section     = document.getElementById("signature-section");
  const envelopeId  = section?.dataset.envelopeId;
  const flowUrl     = section?.dataset.flowUrl;

  if (!envelopeId || envelopeId.trim() === "") {
    if (section) section.style.display = "none";
    return;
  }

  async function loadSignatureData(showSkeleton = true) {
    if (showSkeleton) {
      document.getElementById("signature-body").innerHTML = skeletonHTML();
    }

    if (!flowUrl || flowUrl.trim() === "") {
      document.getElementById("signature-body").innerHTML =
        `<div class="sig-error">Signature status flow URL is not configured.</div>`;
      return;
    }

    try {
      const res = await fetch(flowUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify({ envelopeId })
      });

      if (!res.ok) throw new Error(`Flow call failed: ${res.status}`);

      const envelope = await res.json();

      if (!envelope || !Array.isArray(envelope.recipients)) {
        document.getElementById("signature-body").innerHTML =
          `<div class="sig-card"><div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px">No signature record found.</div></div>`;
        return;
      }

      renderEnvelope(envelope);

    } catch (err) {
      console.error("Signature load error:", err);
      document.getElementById("signature-body").innerHTML =
        `<div class="sig-error">
          Failed to load signature details.
          <button onclick="window.loadSignatureData()" class="sig-refresh" style="margin-left:12px">Retry</button>
        </div>`;
    }
  }

  function renderEnvelope(envelope) {
    const isCompleted = envelope.allCompleted === true;
    const isDeclined  = (envelope.declinedCount || 0) > 0 && !isCompleted;

    const statusClass = isCompleted ? "sig-badge-completed"
                      : isDeclined  ? "sig-badge-declined"
                      :               "sig-badge-pending";
    const statusLabel = isCompleted ? "Completed"
                      : isDeclined  ? "Declined"
                      :               "Pending";

    const recipients = envelope.recipients || [];
    const sortedRecipients = [...recipients].sort(
      (a, b) => (parseInt(a.order, 10) || 1) - (parseInt(b.order, 10) || 1)
    );

    let html = `
    <div class="sig-card">
      <div class="sig-header">
        <div style="flex:1;min-width:0">
          <h3 class="sig-title">Signature Envelope</h3>
          <div class="sig-meta">
            <span class="sig-badge ${statusClass}">${statusLabel}</span>
            <span class="sig-badge sig-badge-type">${envelope.completedCount ?? 0} of ${envelope.totalCount ?? recipients.length} completed</span>
          </div>
        </div>
        <button onclick="window.loadSignatureData(false)" class="sig-refresh">Refresh</button>
      </div>
      <div class="sig-list">`;

    sortedRecipients.forEach(rec => {
      const recStatus    = (rec.status || "").toLowerCase();
      const rowCompleted = recStatus === "completed";
      const rowDeclined  = recStatus === "declined";

      const avatarClass = rowCompleted ? "sig-avatar-completed"
                        : rowDeclined  ? "sig-avatar-declined"
                        :                "sig-avatar-pending";
      const avatarChar  = rowCompleted ? "✓" : rowDeclined ? "✕" : (rec.role || "—").charAt(0).toUpperCase();

      html += `
      <div class="sig-row">
        <div class="sig-avatar ${avatarClass}">${avatarChar}</div>
        <div class="sig-row-body">
          <div class="sig-row-top">
            <span class="sig-name">${rec.role ?? "—"}</span>
            <span class="sig-decision ${rowCompleted ? "sig-decision-completed" : rowDeclined ? "sig-decision-declined" : "sig-badge-pending"}">
              ${(rec.status ? rec.status.charAt(0).toUpperCase() + rec.status.slice(1) : "Pending")}
            </span>
          </div>
          <div class="sig-date">${rec.email ?? "—"}</div>
          <div class="sig-date">
            ${rec.sentDateTime ? `Sent ${formatDate(rec.sentDateTime)}` : "Not yet sent"}
            ${rec.completedDateTime ? `&nbsp;·&nbsp; ${rowCompleted ? "Signed" : "Actioned"} ${formatDate(rec.completedDateTime)}` : ""}
          </div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
    document.getElementById("signature-body").innerHTML = html;
  }

  function skeletonHTML() {
    const row = `
    <div class="sig-row">
      <div class="sig-skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="sig-skeleton" style="height:13px;width:55%;margin-bottom:8px"></div>
        <div class="sig-skeleton" style="height:11px;width:38%"></div>
      </div>
    </div>`;
    return `
    <div class="sig-card">
      <div class="sig-header">
        <div style="flex:1">
          <div class="sig-skeleton" style="height:14px;width:220px;margin-bottom:10px"></div>
          <div class="sig-skeleton" style="height:11px;width:140px"></div>
        </div>
      </div>
      <div class="sig-list">${row}${row}</div>
    </div>`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    return new Date(dateStr).toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  window.loadSignatureData = loadSignatureData;
  loadSignatureData();
})();
</script>
{% endif %}
