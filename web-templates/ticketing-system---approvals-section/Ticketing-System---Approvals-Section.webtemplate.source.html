      <span>Approvals Section</span>

    align-items: flex-start;

    font-weight: 600;
    color: #111827;
    margin: 0 0 8px 0;
  }

    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .apv-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .apv-badge-approved { background: #d1fae5; color: #065f46; }
  .apv-badge-rejected { background: #fee2e2; color: #991b1b; }
  .apv-badge-type     { background: #f3f4f6; color: #374151; }

  .apv-created {
    font-size: 12px;
    color: #9ca3af;
  }

  .apv-refresh {
    flex-shrink: 0;
    background: #ffffff;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .apv-refresh:hover {
    background: #f9fafb;
    border-color: #9ca3af;
  }

  .apv-list {
    padding: 4px 0;
  }

  .apv-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 20px;
  }

  /* .apv-row:last-child {
    border-bottom: none;
  } */

  .apv-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;

  .apv-avatar-rejected { background: #fee2e2; color: #991b1b; border: 2px solid #fecaca; }

    min-width: 0;
  }

    justify-content: space-between;
    gap: 8px;

    margin-left: 6px;

    top: 64px;

  }

  .apv-decision-rejected { background: #fee2e2; color: #991b1b; }

  }

    100% { background-position: -200% 0; }

<script>
(async function () {
  const section     = document.getElementById("approval-section");
  const approvalId  = "{{ ticket.sh_approvalid }}";
  const currentUser = section?.dataset.currentUser?.toLowerCase().trim();

  if (!approvalId || approvalId.trim() === "") {
    if (section) section.style.display = "none";
    return;
  }

  async function loadApprovalData(showSkeleton = true) {
    if (showSkeleton) {
      document.getElementById("approval-body").innerHTML = skeletonHTML();
    }

    try {
      const now = new Date().toISOString();

      const [approvalRes, requestsRes, responsesRes] = await Promise.all([
        fetch(`/_api/msdyn_flow_approvals?$filter=(msdyn_flow_approvalid eq '${approvalId}' and createdon le ${now})&$top=1`, { cache: "no-store" }),
        fetch(`/_api/msdyn_flow_approvalrequests?$filter=(_msdyn_flow_approvalrequest_approval_value eq '${approvalId}' and createdon le ${now})&$orderby=msdyn_flow_approvalrequest_stepnumber asc`, { cache: "no-store" }),
        fetch(`/_api/msdyn_flow_approvalresponses?$filter=(_msdyn_flow_approvalresponse_approval_value eq '${approvalId}' and createdon le ${now})`, { cache: "no-store" })
      ]);

      if (!approvalRes.ok)  throw new Error(`Approval: ${approvalRes.status}`);
      if (!requestsRes.ok)  throw new Error(`Requests: ${requestsRes.status}`);
      if (!responsesRes.ok) throw new Error(`Responses: ${responsesRes.status}`);

      const approval  = (await approvalRes.json()).value?.[0];
      const requests  = (await requestsRes.json()).value  || [];
      const responses = (await responsesRes.json()).value || [];

      if (!approval) {
        document.getElementById("approval-body").innerHTML =
          `<div class="apv-card"><div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px">No approval record found.</div></div>`;
        return;
      }

      let userEmailMap = {};
      const ownerIds = [...new Set(requests.map(r => r["_ownerid_value"]).filter(Boolean))];

      if (ownerIds.length > 0) {
        const userFilter = ownerIds.map(id => `systemuserid eq ${id}`).join(" or ");
        const usersRes = await fetch(
          `/_api/systemusers?$select=systemuserid,internalemailaddress&$filter=${userFilter}`,
          { cache: "no-store" }
        );
        if (usersRes.ok) {
          const usersData = await usersRes.json();
          usersData.value?.forEach(u => {
            userEmailMap[u.systemuserid.toLowerCase()] = u.internalemailaddress?.toLowerCase();
          });
        }
      }

      renderApproval(approval, requests, responses, userEmailMap);

    } catch (err) {
      console.error("Approval load error:", err);
      document.getElementById("approval-body").innerHTML =
        `<div class="apv-error">
          Failed to load approval details.
          <button onclick="window.loadApprovalData()" class="apv-refresh" style="margin-left:12px">Retry</button>
        </div>`;
    }
  }

  function renderApproval(approval, requests, responses, userEmailMap) {
    const result      = approval.msdyn_flow_approval_result;
    const isApproved  = result === "Approve";
    const isRejected  = result === "Reject";
    const isPending   = !result;

    const statusClass = isPending  ? "apv-badge-pending"
                      : isApproved ? "apv-badge-approved"
                      :              "apv-badge-rejected";
    const statusLabel = isPending  ? "Pending"
                      : isApproved ? "Approved"
                      :              "Rejected";

    const modelType    = approval.msdyn_flow_approval_modeltype;
    const isBasic      = modelType === "msdyn_flow_basicapprovalmodel";
    const isAwaitAll   = modelType === "msdyn_flow_awaitallapprovalmodel";
    const isSequential = modelType === "msdyn_flow_sequentialapprovalmodel";
    const typeLabel    = isBasic      ? "First to respond"
                       : isAwaitAll   ? "Everyone must approve"
                       : isSequential ? "Sequential"
                       :                "Unknown";

    const sortedRequests = [...requests].sort((a, b) => {
      if (isSequential) {
        // Descending: highest stage first (matches Teams order)
        return (b.msdyn_flow_approvalrequest_stage ?? 0) - (a.msdyn_flow_approvalrequest_stage ?? 0);
      }
      return new Date(a.createdon) - new Date(b.createdon);
    });
    // <span class="apv-badge ${statusClass}">${statusLabel}</span>
    let html = `
    <div class="apv-card">
      <div class="apv-header">
        <div style="flex:1;min-width:0">
          <h3 class="apv-title">${approval.msdyn_flow_approval_title ?? "Approval Request"}</h3>
          <div class="apv-meta">
            
            <span class="apv-badge apv-badge-type">${typeLabel}</span>
            <span class="apv-created">Created ${formatDate(approval.createdon)}</span>
            ${approval.msdyn_flow_approval_completedon
              ? `<span class="apv-created">&nbsp;·&nbsp; Completed ${formatDate(approval.msdyn_flow_approval_completedon)}</span>`
              : ""}
          </div>
        </div>
        <button onclick="window.loadApprovalData(false)" class="apv-refresh">Refresh</button>
      </div>
      <div class="apv-list ${isSequential ? 'is-sequential' : ''}">`;

    sortedRequests.forEach(req => {
      const name       = req["_ownerid_value@OData.Community.Display.V1.FormattedValue"] ?? "—";
      const initial    = name.charAt(0).toUpperCase();
      const ownerId    = req["_ownerid_value"]?.toLowerCase();
      const stage      = req.msdyn_flow_approvalrequest_stage;
      const assignedOn = req.createdon;

      const resp       = responses.find(r => r["_ownerid_value"] === req["_ownerid_value"]);
      const decision   = resp?.msdyn_flow_approvalresponse_response;
      const comment    = resp?.msdyn_flow_approvalresponse_comments?.trim();
      const actionOn   = resp?.createdon;

      const rowPending  = !resp;
      const rowApproved = decision === "Approve";

      const ownerEmail    = userEmailMap[ownerId] ?? "";
      const isCurrentUser = ownerEmail === currentUser;

      const avatarClass = rowPending  ? "apv-avatar-pending"
                        : rowApproved ? "apv-avatar-approved"
                        :               "apv-avatar-rejected";
      const avatarChar  = rowPending  ? initial
                        : rowApproved ? "✓"
                        :               "✕";

      // Determine status message for pending rows
      let msgHtml = "";
      if (rowPending) {
        if (result) {
          msgHtml = isRejected
            ? `<p class="apv-msg apv-msg-done-rej">Approval rejected — no action required</p>`
            : `<p class="apv-msg apv-msg-done-ok">Approval completed — no action required</p>`;
        } else if (isCurrentUser) {
          if (isSequential) {
            const firstPending = sortedRequests.find(r => {
              const hasResponded = responses.some(res => res["_ownerid_value"] === r["_ownerid_value"]);
              return r.statecode === 0 && !hasResponded;
            });
            const isMyTurn = firstPending?.["_ownerid_value"]?.toLowerCase() === ownerId;
            msgHtml = isMyTurn
              ? `<p class="apv-msg apv-msg-notice">Your approval is required — please respond via Teams or Outlook</p>`
              : `<p class="apv-msg apv-msg-waiting">Waiting for previous stage approver</p>`;
          } else {
            msgHtml = `<p class="apv-msg apv-msg-notice">Your approval is required — please respond via Teams or Outlook</p>`;
          }
        } else {
          msgHtml = `<p class="apv-msg apv-msg-awaiting">Awaiting response</p>`;
        }
      } else {
        msgHtml = comment
          ? `<p class="apv-msg apv-msg-comment">${comment}</p>`
          : `<p class="apv-msg apv-msg-nocomment">No comments added</p>`;
      }

      html += `
      <div class="apv-row">
        <div class="apv-avatar ${avatarClass}">${avatarChar}</div>
        <div class="apv-row-body">
          <div class="apv-row-top">
            <div>
              <span class="apv-name">${name}</span>
              ${isCurrentUser ? `<span class="apv-you">You</span>` : ""}
            </div>
            ${!rowPending
              ? `<span class="apv-decision ${rowApproved ? "apv-decision-approved" : "apv-decision-rejected"}">
                   ${rowApproved ? "Approved" : "Rejected"}
                 </span>`
              : ""}
          </div>
          <div class="apv-date">
            Assigned ${formatDate(assignedOn)}
            ${actionOn ? `&nbsp;·&nbsp; ${rowApproved ? "Approved" : "Rejected"} ${formatDate(actionOn)}` : ""}
          </div>
          ${msgHtml}
        </div>
      </div>`;
    });

    html += `</div></div>`;
    document.getElementById("approval-body").innerHTML = html;
  }

  function skeletonHTML() {
    const row = `
    <div class="apv-row">
      <div class="apv-skeleton" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="apv-skeleton" style="height:13px;width:55%;margin-bottom:8px"></div>
        <div class="apv-skeleton" style="height:11px;width:38%"></div>
      </div>
    </div>`;
    return `
    <div class="apv-card">
      <div class="apv-header">
        <div style="flex:1">
          <div class="apv-skeleton" style="height:14px;width:220px;margin-bottom:10px"></div>
          <div class="apv-skeleton" style="height:11px;width:140px"></div>
        </div>
      </div>
      <div class="apv-list">${row}${row}</div>
    </div>`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    return new Date(dateStr).toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  window.loadApprovalData = loadApprovalData;
  loadApprovalData();
})();
</script>

      }

      try {
        
        // Generate current datetime in ISO format
        const now = new Date().toISOString();

        const [approvalRes, requestsRes, responsesRes] = await Promise.all([
          fetch(`/_api/msdyn_flow_approvals?$filter=(msdyn_flow_approvalid eq '${approvalId}' and createdon le ${now})&$top=1`, {
            cache: "no-store"
          }),

          fetch(`/_api/msdyn_flow_approvalrequests?$filter=(_msdyn_flow_approvalrequest_approval_value eq '${approvalId}' and createdon le ${now})&$orderby=msdyn_flow_approvalrequest_stepnumber asc`, {
            cache: "no-store"
          }),

          fetch(`/_api/msdyn_flow_approvalresponses?$filter=(_msdyn_flow_approvalresponse_approval_value eq '${approvalId}' and createdon le ${now})`, {
            cache: "no-store"
          })
        ]);

        if (!approvalRes.ok) throw new Error(`Approval: ${approvalRes.status}`);
        if (!requestsRes.ok) throw new Error(`Requests: ${requestsRes.status}`);
        if (!responsesRes.ok) throw new Error(`Responses: ${responsesRes.status}`);

        const approval = (await approvalRes.json()).value?.[0];
        const requests = (await requestsRes.json()).value || [];
        const responses = (await responsesRes.json()).value || [];

        // Log stage information for debugging
        requests.forEach((req, idx) => {
          console.log(`Request ${idx + 1}:`, {
            owner: req["_ownerid_value@OData.Community.Display.V1.FormattedValue"],
            stage: req.msdyn_flow_approvalrequest_stage,
            statecode: req.statecode,
            pending: req.statecode === 0
          });
        });

        if (!approval) {
          document.getElementById("approval-body").innerHTML =
            `<div class="approval-card"><div style="padding:24px;text-align:center;color:#6c757d;font-size:14px">No approval record found.</div></div>`;
          return;
        }

        // ── Fetch systemuser emails for exact matching ─────────────────────────
        let userEmailMap = {};
        const ownerIds = [...new Set(requests.map(r => r["_ownerid_value"]).filter(Boolean))];

        if (ownerIds.length > 0) {
          const userFilter = ownerIds.map(id => `systemuserid eq ${id}`).join(" or ");
          const usersRes = await fetch(
            `/_api/systemusers?$select=systemuserid,internalemailaddress&$filter=${userFilter}`,
            { cache: "no-store" }
          );
          if (usersRes.ok) {
            const usersData = await usersRes.json();
            usersData.value?.forEach(u => {
              userEmailMap[u.systemuserid.toLowerCase()] = u.internalemailaddress?.toLowerCase();
            });
          }
          console.log("✅ User email map:", userEmailMap);
        }

        // ── Exact email match for pending approver ─────────────────────────────
        const myRequest = requests.find(r => {
          const ownerEmail = userEmailMap[r["_ownerid_value"]?.toLowerCase()] ?? "";
          const isPending = r.statecode === 0;
          return ownerEmail === currentUser && isPending;
        });

        console.log("✅ Approval:", approval);
        console.log("✅ Requests:", requests);
        console.log("✅ Responses:", responses);
        console.log("✅ My request:", myRequest ?? "None — not a pending approver");

        renderApproval(approval, requests, responses, myRequest, userEmailMap);

      } catch (err) {
        console.error("Approval load error:", err);
        document.getElementById("approval-body").innerHTML =
          `<div class="error-message">
            Failed to load approval details.
            <button onclick="window.loadApprovalData()" class="btn btn-refresh" style="margin-left:12px">Retry</button>
          </div>`;
      }
    }
    // ── Submit ─────────────────────────────────────────────────────────────────
    async function submitResponse(response) {
      const comments = document.getElementById("approval-comments")?.value?.trim() || "";

        // ✅ Get approvalRequestId from button data attribute
      const btn = document.getElementById(`btn-${response.toLowerCase()}`);
      const approvalRequestId = btn?.dataset?.requestId;

      if (!approvalRequestId) {
        showToast("Approval request ID not found", "danger");
        return;
      }

      ["approve", "reject"].forEach(r => {
        const b = document.getElementById(`btn-${r}`);
        if (b) { b.disabled = true; }
      });
      // const btn = document.getElementById(`btn-${response.toLowerCase()}`);
      if (btn) btn.textContent = "Submitting...";

      try {
        const res = await fetch(flowUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ approvalId, approvalRequestId, response, comments, responderEmail: currentUser })
        });

        if (!res.ok) throw new Error(`Flow: ${res.status}`);

        showToast(
          response === "Approve" ? "Approved successfully" : "Rejection submitted.",
          response === "Approve" ? "success" : "danger"
        );
        
        // Reload after 2 seconds
        setTimeout(() => loadApprovalData(), 2000);

      } catch (err) {
        console.error("Submit error:", err);
        showToast("Something went wrong. Please try again.", "danger");
        ["approve", "reject"].forEach(r => {
          const b = document.getElementById(`btn-${r}`);
          if (b) { b.disabled = false; }
        });
        if (btn) btn.textContent = response === "Approve" ? "Approve" : "Reject";
      }
    }

    function renderApproval(approval, requests, responses, myRequest, userEmailMap) {
      const result = approval.msdyn_flow_approval_result;
      const isApproved = result === "Approve";
      const isRejected = result === "Reject";
      const isPending = !result;

      const statusClass = isPending ? "status-pending" : isApproved ? "status-approved" : "status-rejected";
      const statusLabel = isPending ? "Pending" : isApproved ? "Approved" : "Rejected";

      // ✅ DETERMINE APPROVAL TYPE FROM MODEL TYPE
      const modelType = approval.msdyn_flow_approval_modeltype;
      
      const isBasic = modelType === "msdyn_flow_basicapprovalmodel";
      const isAwaitAll = modelType === "msdyn_flow_awaitallapprovalmodel";
      const isSequential = modelType === "msdyn_flow_sequentialapprovalmodel";

      const typeLabel = isBasic ? "First to respond" : 
                      isAwaitAll ? "Everyone must approve" : 
                      isSequential ? "Sequential" : "Unknown";

      let html = `
      <div class="approval-card">
        <div class="approval-header">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
            <div style="flex:1">
              <h3 class="approval-title">
                ${approval.msdyn_flow_approval_title ?? "Approval Request"}
              </h3>
              <div class="approval-meta">
                <span class="status-badge ${statusClass}">
                  ${statusLabel}
                </span>
                <span class="status-badge" style="background:#fff3e0;color:#e65100">${typeLabel}</span>
                <span style="font-size:12px;color:#6b7280">
                  Created ${formatDate(approval.createdon)}
                </span>
                ${approval.msdyn_flow_approval_completedon ? `
                  <span style="color:#6b7280">•</span>
                  <span style="font-size:12px;color:#6b7280">
                    Completed ${formatDate(approval.msdyn_flow_approval_completedon)}
                  </span>` : ""}
              </div>
            </div>
            <button onclick="window.loadApprovalData(false)" class="btn btn-refresh">
              Refresh
            </button>
            
          </div>
        </div>

        <div class="approval-timeline">`;

      // ✅ SORT REQUESTS BY STAGE (for sequential) OR BY CREATION DATE
      const sortedRequests = [...requests].sort((a, b) => {
        if (isSequential) {
          const stageA = a.msdyn_flow_approvalrequest_stage ?? 0;
          const stageB = b.msdyn_flow_approvalrequest_stage ?? 0;
          return stageA - stageB;
        }
        return new Date(a.createdon) - new Date(b.createdon);
      });

      // ✅ DETERMINE WHO CAN TAKE ACTION
      let canApprove = new Set();

      // 🚫 CRITICAL: If approval has a result, it's completed - NO actions allowed
      // This aligns with Power Automate Flow completion logic
      if (result) {
        canApprove = new Set(); // Empty - approval is done
        console.log("⛔ Approval completed with result:", result, "- No further actions allowed");

      } else {
        // Approval is still pending - check who can act based on approval type

        if (isBasic) {
          // BASIC (First to Respond): Allow actions only if NO responses exist yet
          // Once someone responds, Flow will mark as complete
          const hasAnyResponse = responses.length > 0;

          if (!hasAnyResponse) {
            // No responses yet - all pending requests can act
            sortedRequests.forEach(r => {
              if (r.statecode === 0) {
                canApprove.add(r["_ownerid_value"]?.toLowerCase());
              }
            });
          }
          console.log("📍 Basic - Has responses:", hasAnyResponse, "| Can approve:", canApprove.size);

        } else if (isAwaitAll) {
          // AWAIT ALL: All pending users who haven't responded can act
          // Flow will mark complete when all respond OR anyone rejects
          sortedRequests.forEach(r => {
            if (r.statecode === 0) {
              const hasResponded = responses.some(resp =>
                resp["_ownerid_value"] === r["_ownerid_value"]
              );
              if (!hasResponded) {
                canApprove.add(r["_ownerid_value"]?.toLowerCase());
              }
            }
          });
          console.log("📍 AwaitAll - Pending approvers who can act:", canApprove.size);

        } else if (isSequential) {
          // SEQUENTIAL: Only the FIRST pending user who hasn't responded can act
          // Flow will mark complete when all stages done OR anyone rejects
          const firstPending = sortedRequests.find(r => {
            const hasResponded = responses.some(resp =>
              resp["_ownerid_value"] === r["_ownerid_value"]
            );
            return r.statecode === 0 && !hasResponded;
          });

          if (firstPending) {
            canApprove.add(firstPending["_ownerid_value"]?.toLowerCase());
            console.log("📍 Sequential - Next approver:", firstPending["_ownerid_value@OData.Community.Display.V1.FormattedValue"]);
          } else {
            console.log("📍 Sequential - No pending approvers found");
          }
        }
      }

      console.log("✅ Final decision - Users who can approve:", Array.from(canApprove));
      console.log("✅ Approval state:", result ? `COMPLETED (${result})` : "PENDING");
      console.log("✅ Total responses so far:", responses.length);

      // ✅ RENDER EACH APPROVER
      
      sortedRequests.forEach((req, index) => {
        const name = req["_ownerid_value@OData.Community.Display.V1.FormattedValue"] ?? "—";
        const initial = name.charAt(0).toUpperCase();
        const assignedOn = req.createdon;
        const ownerId = req["_ownerid_value"]?.toLowerCase();
        const stage = req.msdyn_flow_approvalrequest_stage;

        const resp = responses.find(r => r["_ownerid_value"] === req["_ownerid_value"]);
        const decision = resp?.msdyn_flow_approvalresponse_response;
        const comment = resp?.msdyn_flow_approvalresponse_comments?.trim();
        const actionOn = resp?.createdon;

        const rowPending = !resp;
        const rowApproved = decision === "Approve";

        const ownerEmail = userEmailMap[ownerId] ?? "";
        const isCurrentUser = ownerEmail === currentUser;

        // ✅ Check if this user can take action
        const showActions = isCurrentUser && canApprove.has(ownerId);

        const dotClass = rowPending ? "pending" : rowApproved ? "approved" : "rejected";
        const dotChar = rowPending ? initial : rowApproved ? "✓" : "✕";

        html += `
        <div class="timeline-item">
          <div class="timeline-dot ${dotClass}">
            ${dotChar}
          </div>

          <div class="timeline-content">
            <div class="approver-info">
              <div>
                <span class="approver-name">${name}</span>
                ${isCurrentUser ? `<span class="you-badge">You</span>` : ""}
                ${isSequential && stage != null ? `<span style="margin-left:8px;font-size:11px;color:#6b7280;font-weight:normal">Stage ${stage}</span>` : ""}
              </div>
              ${!rowPending ? `
                <span class="decision-badge ${rowApproved ? "approved" : "rejected"}">
                  ${rowApproved ? "Approved" : "Rejected"}
                </span>` : ""}
            </div>

            <div class="timeline-dates">
              Assigned ${formatDate(assignedOn)}
              ${actionOn ? ` • ${rowApproved ? "Approved" : "Rejected"} ${formatDate(actionOn)}` : ""}
            </div>

            <p class="timeline-comment ${!comment && !rowPending ? "empty" : ""}">
              ${rowPending
                ? (() => {
                  // CASE 1: Approval is complete (has result)
                  if (result) {
                    if (isRejected) {
                      return '<span style="color:#ef4444;font-style:italic">⛔ Approval rejected - no action required</span>';
                    } else {
                      return '<span style="color:#10b981;font-style:italic">✓ Approval approved - no action required</span>';
                    }
                  }

                  // CASE 2: Approval still pending - Current user can take action
                  if (isCurrentUser && showActions) {
                    return '<span style="color:#3b82f6;font-weight:500">⏰ Your approval is required</span>';
                  }

                  // CASE 3: Approval still pending - Current user cannot take action
                  if (isCurrentUser && !showActions) {
                    if (isSequential) {
                      return '<span style="color:#f59e0b;font-style:italic">⏳ Waiting for previous stage approver</span>';
                    } else {
                      return '<span style="color:#9ca3af;font-style:italic">Already decided by another approver</span>';
                    }
                  }

                  // CASE 4: Not current user - just show pending
                  return '<span style="color:#9ca3af;font-style:italic">Awaiting response</span>';
                })()
                : comment || '<span style="font-style:italic">No comments added</span>'}
            </p>

            ${showActions ? `
              <div class="action-panel">
                <textarea id="approval-comments" class="comment-textarea" rows="2" placeholder="Add a comment (optional)"></textarea>
                <div class="action-buttons">
                  <button id="btn-approve" data-request-id="${req.msdyn_flow_approvalrequestid}" onclick="window.submitResponse('Approve')" class="btn btn-approve">
                    Approve
                  </button>
                  <button id="btn-reject" data-request-id="${req.msdyn_flow_approvalrequestid}" onclick="window.submitResponse('Reject')" class="btn btn-reject">
                    Reject
                  </button>
                </div>
              </div>` : ""}
          </div>
        </div>`;
      });

      html += `</div></div>`;
      document.getElementById("approval-body").innerHTML = html;
    }
