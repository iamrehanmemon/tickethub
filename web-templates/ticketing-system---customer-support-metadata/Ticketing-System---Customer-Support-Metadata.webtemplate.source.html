<script>
  const ticketTypeMap = {
    "Request": [
      "Address & Phone number updated تحديث العنوان ورقم التواصل",
      "Address Updated تم تحديث العنوان",
      "Consignee Ready Now العميل جاهز للإستلام",
      "Mobile Updated تم تحديث الجوال",
      "Delivery Reschedule تأجيل التوصيل",
      "RTO Request إلغاء التوصيل",
      "Bayan Request طلب بيان جمركي",
      "Courier Behavior سلوك المندوب",
      "Delivered (Wrong Scan) لم يتم التوصيل فعلياً",
      "Refund Request تسوية مالي"
    ],
    "Incident": [
      "Delay تأخير",
      "Out of Zone خارج نطاق المندوب",
      "Wrong NDR سبب غير صحيح"
    ]
  };

  document.addEventListener("DOMContentLoaded", function () {
    const fetchAddressBtn = document.getElementById("fetchAddressBtn");
    const shortCodeInput = document.getElementById("sh_shortaddresscode");

    if (!fetchAddressBtn || !shortCodeInput) return;

    fetchAddressBtn.addEventListener("click", async function () {
      const code = shortCodeInput.value.trim();

      if (!code) {
        alert("Please enter Short Address Code first.");
        return;
      }

      try {
        showLoader("Fetching address details...");

        // ✅ Replace this URL with your Power Automate / API endpoint
        // Example: const fetchAddressUrl = "https://prod-xx.westeurope.logic.azure.com:443/workflows/....";
        const response = await fetch(fetchAddressUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shortAddressCode: code })
        });

        const result = await response.json();
        hideLoader();

        if (!response.ok) {
          console.error("Address API error:", result);
          alert("Failed to fetch address. Please check the code and try again.");
          return;
        }

        // ✅ Normalize response (supports either {address:{...}} or direct object)
        const address = result.address || result || {};

        // ✅ Ensure address section is visible before populating
        const addressSection = document.getElementById("newAddressSection");
        if (addressSection) addressSection.classList.remove("d-none");

        // ✅ Populate fields (map your API keys here)
        setFieldValue("sh_newaddressline1", address.addressLine1 || address.line1 || "");
        setFieldValue("sh_newaddressline2", address.addressLine2 || address.line2 || "");
        setFieldValue("sh_newaddresscity", address.city || "");
        setFieldValue("sh_newaddressstate", address.state || address.region || "");
        setFieldValue("sh_newaddresscountry", address.country || "");
        setFieldValue("sh_newaddresspincode", address.postcode || "");
        setFieldValue("sh_addressadditionalnumber", address.additionalnumber || "");

        // Optional: if API returns phone/email/name etc, you can map those too.
        // setFieldValue("sh_consigneename", address.consigneeName || "");
        // setFieldValue("sh_consigneephone", address.mobile || "");

      } catch (err) {
        hideLoader();
        console.error("❌ Error fetching short address:", err);
        alert("An error occurred while fetching address. Please try again.");
      }
    });

    // ✅ helper to set input value safely
    function setFieldValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = value ?? "";

      // Trigger input event so your canned-response renderer updates (if you added that)
      el.dispatchEvent(new Event("input", { bubbles: true }));
    }

    //Function to auto load the ticket type in dropdown
    const categoryDropdown = document.getElementById("sh_category");
    const ticketTypeDropdown = document.getElementById("sh_tickettype");

    if (categoryDropdown && ticketTypeDropdown) {
      categoryDropdown.addEventListener("change", function () {
        const selectedText = this.options[this.selectedIndex]?.text?.trim();

        // Find which ticket type (Request/Incident) the selected category belongs to
        const ticketType = Object.keys(ticketTypeMap).find(type =>
          ticketTypeMap[type].some(label =>
            label.trim().toLowerCase() === selectedText.toLowerCase()
          )
        );

        if (!ticketType || ticketTypeDropdown.options.length <= 1) return;

        // Find the matching option by text and set its GUID as the value
        for (let opt of ticketTypeDropdown.options) {
          if (opt.text.trim().toLowerCase() === ticketType.toLowerCase()) {
            ticketTypeDropdown.value = opt.value;
            break;
          }
        }
      });
    }
  });
</script>
