<script>
  const countryDDL = document.getElementById("sh_country");

  countryDDL.addEventListener("change", function () {
    const country = countryDDL.options[countryDDL.selectedIndex]?.text?.trim();

    let categoryConfig = "procurementCategoryKSA"; // fallback

    if (country === "Kingdom of Saudi Arabia") {
      categoryConfig = "procurementCategoryKSA";
    } else if (country === "United Arab Emirates") {
      categoryConfig = "procurementCategoryUAE";
    }

    populateDropdown("sh_procurementcategory", categoryConfig);

    // reset dependent field
    sh_procurementcategory.value = "";
  });

  document.getElementById("sh_findimsubservice").addEventListener("change", function () {
    const selectedText = this.options[this.selectedIndex]?.text || "";
    const serviceName = selectedText.includes("|")
      ? selectedText.split("|")[0].trim()
      : "";

    if (!serviceName) return;

    const serviceSelect = document.getElementById("sh_findimservice");

    // Find the already-loaded option that matches the service name
    const matchingOption = Array.from(serviceSelect.options).find(
      opt => opt.text.trim().toLowerCase() === serviceName.toLowerCase()
    );

    if (matchingOption) {
      matchingOption.selected = true;
      serviceSelect.value = matchingOption.value; // GUID is already on the option
    }
  });

    // Function to auto select department based on selected Cost Center
    document.getElementById("sh_findimcostcentre").addEventListener("change", function () {
      const selectedText = this.options[this.selectedIndex]?.text || "";
      
      if (!selectedText) return;

      // Extract first two digits/characters from the selected Cost Center name
      const costCenterPrefix = selectedText.trim().substring(0, 2).toLowerCase();

      if (!costCenterPrefix) return;

      const departmentSelect = document.getElementById("sh_department");

      // Find the department option whose name starts with the same two characters
      const matchingOption = Array.from(departmentSelect.options).find(
        opt => opt.text.trim().substring(0, 2).toLowerCase() === costCenterPrefix
      );

      if (matchingOption) {
        matchingOption.selected = true;
        departmentSelect.value = matchingOption.value; // GUID is already on the option
      }
    });
</script>

<!-- Approved Vendor Lookup -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const input      = document.getElementById("approvedVendorSearch");
  const resultsBox = document.getElementById("approvedVendorSearchResults");
  const hiddenId   = document.getElementById("approvedVendorIdHidden");

  if (!input)      { console.error("❌ approvedVendorSearch input not found");   return; }
  if (!resultsBox) { console.error("❌ approvedVendorSearchResults ul not found"); return; }

  console.log("✅ Approved Vendor lookup initialized");

  let debounceTimer;

  input.addEventListener("input", function () {
    clearTimeout(debounceTimer);

    const query = this.value.trim();
    console.log("🔍 Input changed:", query);

    if (!query) {
      hiddenId.value = "";
      resultsBox.style.display = "none";
      return;
    }

    if (query.length < 2) return;

    debounceTimer = setTimeout(function () {
      fetchVendors(query);
    }, 350);
  });

  async function fetchVendors(query) {
    const encoded = encodeURIComponent(query);
    const legalEntityRaw = document.getElementById("sh_legalentityname").options[document.getElementById("sh_legalentityname").selectedIndex]?.text || "";
    const dataAreaId = legalEntityRaw.split("|")[0].trim();

    console.log("🏢 dataAreaId filter:", dataAreaId);

    const url = `/_api/sh_vendorses?$select=sh_vendorsid,sh_vendorname,sh_vendornumber&$filter=(contains(sh_vendorname,'${encoded}') or contains(sh_vendornumber,'${encoded}')) and sh_vendortier eq 'Tier 1' and sh_dataareaid eq '${dataAreaId}'&$top=20&$orderby=sh_vendorname asc`;

    console.log("📡 Fetching:", url);

    try {
      const res  = await fetch(url);
      console.log("📥 Response status:", res.status);

      const data = await res.json();
      console.log("📦 Data returned:", data);

      const results = data.value || [];
      console.log(`✅ ${results.length} vendor(s) found`);

      resultsBox.innerHTML = "";

      if (results.length === 0) {
        resultsBox.innerHTML = `<li class="list-group-item text-muted">No vendors found</li>`;
        resultsBox.style.display = "block";
        return;
      }

      results.forEach(function (v) {
        const label = v.sh_vendornumber
          ? `${v.sh_vendornumber} | ${v.sh_vendorname}`
          : v.sh_vendorname;

        const li       = document.createElement("li");
        li.className   = "list-group-item list-group-item-action";
        li.textContent = label;
        li.style.cursor = "pointer";

        li.addEventListener("click", function () {
          input.value    = label;
          hiddenId.value = v.sh_vendorsid;
          resultsBox.style.display = "none";
          console.log("✅ Vendor selected:", v);
        });

        resultsBox.appendChild(li);
      });

      resultsBox.style.display = "block";

    } catch (err) {
      console.error("❌ Fetch error:", err);
      resultsBox.innerHTML = `<li class="list-group-item text-danger">Error fetching vendors</li>`;
      resultsBox.style.display = "block";
    }
  }

  // Close on outside click
  document.addEventListener("click", function (e) {
    if (!input.contains(e.target) && !resultsBox.contains(e.target)) {
      resultsBox.style.display = "none";
    }
  });

});
</script>
