<!-- GLOBAL LOADER OVERLAY -->
<div id="loaderOverlay" class="sl-loader-overlay d-none justify-content-center align-items-center">
  <div class="sl-loader-box text-center">
    <!-- Starlinks Spinner -->
    <div class="sl-loader-spinner"></div>
    <!-- Dynamic Message -->
    <div id="loaderMessage" class="sl-loader-message mt-3">
      Loading
    </div>
  </div>
</div>

<style>
/* ----- Overlay Container ----- */
.sl-loader-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10999;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease-in-out;
}

/* ----- Loader Box Animation ----- */
.sl-loader-box {
    animation: slFadeInUp .35s ease forwards;
}

/* ----- STARLINKS GREEN SPINNER ----- */
.sl-loader-spinner {
    width: 70px;
    height: 70px;
    border: 6px solid rgba(0, 111, 74, 0.18);  /* Starlinks mint tone */
    border-top-color: #006F4A;                /* Starlinks primary green */
    border-radius: 50%;
    animation: slSpin 0.85s linear infinite;
    margin: 0 auto;
}

/* ----- Loader Text ----- */
.sl-loader-message {
    font-family: 'Gotham Narrow', 'DIN Next L', sans-serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: #004f35;  /* Dark Starlinks green */
}

/* ----- Animations ----- */
@keyframes slSpin {
    to { transform: rotate(360deg); }
}

@keyframes slFadeInUp {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
